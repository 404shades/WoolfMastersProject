spring.application.name=EcommerceMasterBackendProject

# Passing postgresql db credentials via environment variables.
spring.datasource.url=jdbc:postgresql://${POSTGRES_URL:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:spring_ecommerce}
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# JPA configurations
spring.jpa.show-sql=true
spring.data.jpa.repositories.enabled=true
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate

# ProblemDetails for standardized error responses
spring.mvc.problemdetails.enabled=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Logging pattern with correlation id from MDC
logging.pattern.level=%5p [cid:%X{correlationId}]
